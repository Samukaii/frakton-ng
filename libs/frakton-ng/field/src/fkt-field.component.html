<div
    class="input"
    [class.invalid]="errorVisible()"
    [class.focused]="control()?.focused()"
    [class.float]="control()?.value() || control()?.focused()"
    [class.disabled]="control()?.disabled()"
>
    <div #prefix>
        <ng-content select="[fktFieldPrefix]"/>
    </div>

    <ng-content select="[fktInputText]"/>
    <ng-content select="[fktFieldSuffix]"/>

    <div class="border">
        <div class="left" [style.padding-right.px]="prefixWidth()">
        </div>
        <div
            [style.width.px]="labelWidth()"
            [style.min-width.px]="labelWidth()"
            class="center">
            <label [class.fkt-sr-only]="hideLabel()" #labelElement [attr.for]="control()?.id">
                {{ `${label()}${requiredVisible() ? '*' : ''}` }}
            </label>
        </div>

        <div class="right">
        </div>
    </div>
</div>

<div
    class="hint-row"
    [class.show]="errorVisible() || hintVisible() || characterCountState()"
>
    <span class="hint-start">
        @if (errorVisible()) {
            <ng-content select="[fktError]">
                <fkt-field-error>
                    @if (error()) {
                        {{ error() }}
                    }
                </fkt-field-error>
            </ng-content>
        } @else {
            <ng-content select="[fktHintStart],[fktHint]">
                @if (hint()) {
                    <fkt-field-hint>{{ hint() }}</fkt-field-hint>
                }
            </ng-content>
        }
    </span>

    <span class="hint-end">
        <ng-content select="[fktHintEnd]">
            @if (characterCountState(); as count) {
                <span
                    class="character-count"
                    [class.exceeded]="count.exceeded"
                >
                    {{ count.current }}
                    @if (count.max !== null) {
                        / {{ count.max }}
                    }
                </span>
            }
        </ng-content>
    </span>
</div>
