<fkt-saturation-lightness-selector
    [(value)]="transformedValue"
/>
<fkt-hue-selector
    [(value)]="transformedValue"
/>

@if (!disableAlphaChanel()) {
    <fkt-alpha-selector [(value)]="transformedValue"/>
}

<fkt-color-control [formatOptions]="formatOptions" [(currentFormat)]="currentFormat" [(value)]="transformedValue"
                   [disableAlphaChanel]="disableAlphaChanel()">
    @switch (currentFormat()) {
        @case ("hsl") {
            <fkt-color-hsl-control
                [disableAlphaChannel]="disableAlphaChanel()"
                [(value)]="transformedValue"
            />
        }
        @case ("rgb") {
            <fkt-color-rgb-control
                [disableAlphaChannel]="disableAlphaChanel()"
                [(value)]="transformedValue"
            />
        }
        @case ("hex") {
            <fkt-color-hex-control
                [disableAlphaChannel]="disableAlphaChanel()"
                [(value)]="transformedValue"
            />
        }
    }
</fkt-color-control>
