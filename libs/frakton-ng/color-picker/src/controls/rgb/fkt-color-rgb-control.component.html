<fkt-field [label]="locale.controls.rgb.red" hideLabel>
    <input fktInputText [formField]="form.red" type="number">
</fkt-field>
<fkt-field [label]="locale.controls.rgb.green" hideLabel>
    <input fktInputText [formField]="form.green" type="number">
</fkt-field>

<fkt-field [label]="locale.controls.rgb.blue" hideLabel>
    <input fktInputText [formField]="form.blue" type="number">
</fkt-field>

@if (!disableAlphaChannel()) {
    <fkt-field [label]="locale.controls.opacity" hideLabel>
        <input fktInputText [formField]="form.alpha" type="number">
    </fkt-field>
}
