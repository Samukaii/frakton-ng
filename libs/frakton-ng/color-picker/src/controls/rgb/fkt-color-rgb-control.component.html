<fkt-color-control-item isFirst>
    <fkt-input
        hideLabel
        [label]="locale.controls.rgb.red"
        hideNumericControl
        [formField]="form.red"
        [minNumber]="0"
        [maxNumber]="255"
        type="number"
    />
</fkt-color-control-item>
<fkt-color-control-item>
    <fkt-input
        hideLabel
        hideNumericControl
        [label]="locale.controls.rgb.green"
        [formField]="form.green"
        [minNumber]="0"
        [maxNumber]="255"
        type="number"
    />
</fkt-color-control-item>

<fkt-color-control-item [isLast]="disableAlphaChannel()">
    <fkt-input
        hideLabel
        hideNumericControl
        [label]="locale.controls.rgb.blue"
        [formField]="form.blue"
        [minNumber]="0"
        [maxNumber]="255"
        type="number"
    />
</fkt-color-control-item>
@if (!disableAlphaChannel()) {
    <fkt-color-control-item isLast>
        <fkt-input
            hideLabel
            hideNumericControl
            [label]="locale.controls.opacity"
            [formField]="form.alpha"
            [minNumber]="0"
            [maxNumber]="100"
            type="number"
        />
    </fkt-color-control-item>
}
