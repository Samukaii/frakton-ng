<fkt-field [label]="locale.controls.hex.code" hideLabel>
    <input fktHexColorMask fktInputText [formField]="hexCodeField">
</fkt-field>
@if (!disableAlphaChannel()) {
    <fkt-field [label]="locale.controls.hex.code" hideLabel>
        <input fktInputText type="number" [formField]="alphaField">
    </fkt-field>
}
