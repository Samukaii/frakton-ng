<fkt-field [label]="locale.controls.hsl.hue" hideLabel>
    <input [formField]="form.hue" fktInputText type="number">
</fkt-field>
<fkt-field [label]="locale.controls.hsl.saturation" hideLabel>
    <input [formField]="form.saturation" fktInputText type="number">
</fkt-field>
<fkt-field [label]="locale.controls.hsl.lightness" hideLabel>
    <input [formField]="form.lightness" fktInputText type="number">
</fkt-field>
@if (!disableAlphaChannel()) {
    <fkt-field [label]="locale.controls.opacity" hideLabel>
        <input [formField]="form.alpha" fktInputText type="number">
    </fkt-field>
}
