<fieldset class="controls">
    <legend class="fkt-sr-only">
        {{ locale.controls.ariaLegend }}
    </legend>

    <fkt-select
        [label]="locale.controls.formatType"
        hideLabel
        hideClearButton
        valueKey="value"
        labelKey="label"
        [(value)]="currentFormat"
        [options]="formatOptions()"
    />

    <ng-content></ng-content>
</fieldset>

<div class="value">
    <div aria-hidden="true">
        <div class="preview">
            <div class="color">
                <div class="fkt-transparency-bg">
					<span [style.background-color]="preview().value">
					</span>
                </div>
            </div>

            <div class="info">
                <p>
                    {{ preview().value }}
                </p>
                <p class="text-description">
                    {{ colorDescription() }}
                </p>
            </div>
        </div>
    </div>

    <div class="actions">
        @if (eyeDropper) {
            <fkt-button
                ariaLabel="Color"
                theme="stroked"
                icon="eye-dropper"
                (click)="pickByEyeDropper()"
            />
        }

        <fkt-button
            (click)="copyValue()"
            [theme]="copied() ? 'raised': 'stroked'"
            [ariaLabel]="locale.actions.copyColorCode"
            [color]="copied() ? 'success' : 'primary'"
            [icon]="copied() ? 'check' : 'clipboard-document-list'"
            [fktTooltip]="locale.actions.copyColorCode"
        />
    </div>
</div>
