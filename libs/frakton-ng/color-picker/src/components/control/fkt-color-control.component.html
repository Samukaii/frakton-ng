<fieldset class="controls">
    <legend class="fkt-sr-only">
        {{ locale.controls.ariaLegend }}
    </legend>

    <fkt-select
            [(value)]="currentFormat"
            [label]="locale.controls.formatType"
            [options]="formatOptions()"
            hideClearButton
            hideLabel
            labelKey="label"
            valueKey="value"
    />

    <ng-content></ng-content>
</fieldset>

<div class="value">
    <div aria-hidden="true">
        <div class="preview">
            <div class="color">
                <div class="fkt-transparency-bg">
					<span [style.background-color]="preview().value">
					</span>
                </div>
            </div>

            <div class="info">
                <p>
                    {{ preview().value }}
                </p>
                <p class="text-description">
                    {{ colorDescription() }}
                </p>
            </div>
        </div>
    </div>

    <div class="actions">
        @if (eyeDropper) {
            <button
                    (click)="pickByEyeDropper()"
                    appearance="stroked"
                    fktButton
                    icon="eye-dropper"
                    iconOnly
                    label="Color">
            </button>
        }

        <button
                (click)="copyValue()"
                [appearance]="copied() ? 'raised': 'stroked'"
                [color]="copied() ? 'success' : 'primary'"
                [fktTooltip]="locale.actions.copyColorCode"
                [icon]="copied() ? 'check' : 'clipboard-document-list'"
                [label]="locale.actions.copyColorCode"
                fktButton
                iconOnly>
        </button>
    </div>
</div>
