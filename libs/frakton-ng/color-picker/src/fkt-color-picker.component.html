<div
    class="field"
    [tabIndex]="0"
    #button
    (keydown.enter)="openPicker(button)"
    (keydown.space)="openPicker(button)"
    (click)="openPicker(button)"
>
	<div class="preview-container">
		<div class="fkt-transparency-bg">
			<div [style.background-color]="previewColor()" class="preview-circle">
				@if (!formattedColor()) {
                    <div class="no-color"></div>
                }
			</div>
		</div>
		<div class="content">
            @if (!hideLabel()) {
                <p class="label">
                    {{ label() }}
                </p>
            }
            @if (value()) {
                <p class="preview-value">
					{{ value() }}
				</p>
            }
		</div>
	</div>


	<div class="actions">
        @if (showCopyButton()) {
            <button
                    (click)="$event.stopPropagation(); copy()"
                    (keydown.enter)="$event.stopPropagation()"
                    (keydown.space)="$event.stopPropagation()"
                    [appearance]="copied() ? 'raised' :'basic'"
                    [color]="copied() ? 'success' : 'primary'"
                    [icon]="copied() ? 'check' : 'clipboard-document-list'"
                    fktButton
                    iconOnly
                    label="Copy">
            </button>
        }
	</div>
</div>
