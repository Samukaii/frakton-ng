<fkt-popover #popover [(open)]="isOpen" preferredPosition="bottom-end">
  <div
    (keydown.enter)="isOpen.set(true)"
    (keydown.space)="isOpen.set(true)"
    [attr.aria-controls]="popover.popoverId()"
    [attr.aria-expanded]="isOpen()"
    [tabIndex]="0"
    aria-haspopup="dialog"
    class="field"
    fktPopoverTrigger
    role="button"
  >
    <div class="preview-container">
      <div class="fkt-transparency-bg">
        <div [style.background-color]="previewColor()" class="preview-circle">
          @if (!formattedColor()) {
            <div class="no-color"></div>
          }
        </div>
      </div>
      <div class="content">
        @if (!hideLabel()) {
          <p class="label">
            {{ label() }}
          </p>
        }
        @if (value()) {
          <p class="preview-value">
            {{ value() }}
          </p>
        }
      </div>
    </div>


    <div class="actions">
      @if (showCopyButton()) {
        <button
          (click)="$event.stopPropagation(); copy()"
          (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()"
          [appearance]="copied() ? 'raised' :'basic'"
          [color]="copied() ? 'success' : 'primary'"
          [icon]="copied() ? 'check' : 'clipboard-document-list'"
          fktButton
          iconOnly
          label="Copy">
        </button>
      }
    </div>
  </div>

  @if (isOpen()) {
    <div
      [attr.aria-label]="label()"
      [autoFocusOnOpen]="true"
      aria-modal="true"
      fktFocusTrap
      [id]="popover.popoverId()"
      fktPopoverContent
      role="dialog"
    >
      <fkt-color-picker-modal
        [(value)]="value"
        [defaultFormat]="defaultFormat()"
        [disableAlphaChanel]="disableAlphaChannel()"
        [outputFormat]="outputFormat()"
      />
    </div>
  }
</fkt-popover>
