<fkt-field [label]="label()">
    <input [(ngModel)]="transformed" [placeholder]="placeholder()" fktDateMask fktInputText/>

    <div #ref class="suffix" fktFieldSuffix suffixNoPadding>
        <button
                (click)="$event.stopImmediatePropagation(); openModal(ref, 'bottom-end')"
                appearance="basic"
                color="primary"
                size="sm"
                fktButton
                icon="calendar"
                iconOnly
                label="Open calendar">
        </button>
    </div>
</fkt-field>
