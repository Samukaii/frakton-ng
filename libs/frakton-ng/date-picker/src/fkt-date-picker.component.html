<fkt-field [label]="label()">
    <input fktInputText [(ngModel)]="transformed" fktDateMask [placeholder]="placeholder()"/>

    <div suffixNoPadding fktFieldSuffix class="suffix" #ref>
        <fkt-button
            theme="basic"
            (click)="$event.stopImmediatePropagation(); openModal(ref, 'bottom-end')"
            icon="calendar"
            color="primary"
            ariaLabel="Open calendar"
        />
    </div>
</fkt-field>
