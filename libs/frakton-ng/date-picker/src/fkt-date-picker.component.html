<fkt-popover
  #popover
  [(open)]="isOpen"
  preferredPosition="bottom-end"
  returnFocus
>
  <fkt-field [label]="label()">
    <input
      (keydown.arrowDown)="isOpen.set(true)"
      [(ngModel)]="transformed"
      [attr.aria-controls]="popover.popoverId()"
      [attr.aria-expanded]="isOpen()"
      [placeholder]="placeholder()"
      aria-haspopup="dialog"
      fktDateMask
      fktInputText
      fktPopoverTrigger
      role="combobox"
      triggerOn="manual"
    />

    <div class="suffix" fktFieldSuffix suffixNoPadding>
      <button
        (click)="isOpen.set(true)"
        appearance="basic"
        color="primary"
        fktButton
        icon="calendar"
        iconOnly
        label="Open calendar"
        size="sm"
        tabIndex="-1">
      </button>
    </div>
  </fkt-field>
  @if (isOpen()) {
    <div
      aria-modal="true"
      autoFocusOnOpen='.calendar__date[tabindex="0"]'
      fktFocusTrap
      fktPopoverContent
      [id]="popover.popoverId()"
      role="dialog"
    >
      <fkt-date-picker-modal
        (select)="select($event)"
        [currentDate]="value() | call: getCurrentDate"
      />
    </div>
  }
</fkt-popover>
