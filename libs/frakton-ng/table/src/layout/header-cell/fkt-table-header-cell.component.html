<div class="header-cell-content">
    @if (templateRef()) {
        <ng-container [ngTemplateOutlet]="templateRef()"/>
    } @else {
        <div class="common-text">
            <div>
                {{ column().header }}
            </div>
            <p>{{ column().description }}</p>
        </div>
    }
    @if (column().allowSorting) {
        <button
                (click)="updateSorting()"
                [icon]="sortingIcon()"
                appearance="basic"
                fktButton
                size="sm"
                iconOnly
                label="order">
        </button>
    }
    @if (column().filter) {
        <fkt-table-filter-renderer
                [(filters)]="filters"
                [column]="column()"
                [defaultFilters]="defaultFilters()"
        />
    }
</div>
@if (canResize && !isLast()) {
    <div (mousedown)="onResizeStart($event)" class="table__resize-handle"></div>
}
