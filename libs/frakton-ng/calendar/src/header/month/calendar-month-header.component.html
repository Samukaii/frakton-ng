<fkt-navigator
        (next)="next()"
        (previous)="previous()"
>
    <div class="container">
		<button
                (click)="monthClick.emit()"
                [label]="$any(currentDate() | date: 'MMMM')"
                appearance="basic"
                class="container__month"
                fktButton>
		</button>

        <button
                (click)="yearClick.emit()"
                [label]="$any(currentDate() | date: 'yyyy')"
                appearance="basic"
                class="container__year"
                fktButton>
		</button>
    </div>
</fkt-navigator>
