<span class="surface">
    @if (showStartLoading()) {
        <ng-container [ngTemplateOutlet]="loadingIndicator"/>
    }

    @if (showStartIcon()) {
        <fkt-icon class="icon" [name]="icon()!" aria-hidden="true"/>
    }

    @if (iconOnly() && !loading() && icon()) {
        <fkt-icon class="icon" [name]="icon()!" aria-hidden="true"/>
    } @else if (hasContent()) {
        <span class="content" aria-hidden="true">
            <ng-content select="[fktButtonContent]"/>
        </span>
    } @else if (!iconOnly()) {
        <span class="label">{{ label() }}</span>
    }

    @if (showSuffixIcon()) {
        <fkt-icon class="icon" [name]="suffixIcon()!" aria-hidden="true"/>
    }

    @if (showEndLoading()) {
        <ng-container [ngTemplateOutlet]="loadingIndicator"/>
    }
</span>

<ng-template #loadingIndicator>
    <span
        class="loading-indicator"
        aria-hidden="true"
    >
        @if (customLoadingIndicator()) {
            <ng-content select="[fktButtonLoadingIndicator]"/>
        } @else {
            <span class="spinner"></span>
        }
    </span>
</ng-template>
