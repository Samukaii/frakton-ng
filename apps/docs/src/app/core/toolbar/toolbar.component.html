<div class="background">

</div>

<header class="toolbar">
    <span class="fkt-sr-only" id=":r0:">Toolbar</span>
    <div class="logo">
        <button
                (click)="mobileMenuService.toggle()"
                appearance="basic"
                class="show-md"
                fktButton
                icon="bars-3"
                iconOnly
                label="Toggle menu">
        </button>
        <div class="logo-wrapper hide-sm">
            <span [innerHTML]="INLINE_SVGS.fraktonLogoOneLineDark | bypassHtml" class="logo-dark"></span>
            <span [innerHTML]="INLINE_SVGS.fraktonLogoOneLineLight | bypassHtml" class="logo-light"></span>
        </div>

        <div class="logo-wrapper show-sm">
            <span [innerHTML]="INLINE_SVGS.fraktonLogoSymbolDark | bypassHtml" class="logo-dark"></span>
            <span [innerHTML]="INLINE_SVGS.fraktonLogoSymbolLight | bypassHtml" class="logo-light"></span>
        </div>

        <span class="toolbar__version-tag hide-sm">
            Beta
          </span>
    </div>
    <div class="toolbar__actions">

        <button (click)="openSearch()" class="search-trigger">
            <div class="text">
                <fkt-icon name="magnifying-glass"/>
                Search
            </div>
            <div aria-hidden="true" class="shortcuts">
                <kbd [innerHTML]="INLINE_SVGS.macCommand | bypassHtml">
                </kbd>
                <kbd>K</kbd>
            </div>
        </button>

        <button (click)="toggleTheme()" appearance="stroked" [icon]="buttonThemeIcon()" [label]="buttonThemeLabel()" class="tool hide-2xs" fktButton
                iconOnly>
        </button>
        <a appearance="stroked" class="tool hide-2xs" fktButton href="https://discord.gg/7r6dsN4aah" icon="discord" iconOnly
           label="Discord Community" rel="noopener noreferrer"
           target="_blank">
        </a>
        <a appearance="stroked" class="tool hide-2xs" fktButton href="https://github.com/Samukaii/frakton-ng" icon="github"
           iconOnly
           label="Frakton Github"
           rel="noopener noreferrer"
           target="_blank">
        </a>

        <span class="toolbar__version-tag show-sm hide-xs">
            Beta
        </span>
    </div>
</header>
