<fkt-field
        [showError]="submitted() && form.email().invalid()"
        label="E-mail"
>
    <fkt-icon fktFieldPrefix name="envelope"/>
    <input [formField]="form.email" fktInputText placeholder="Enter an e-mail">
</fkt-field>

<button
        (click)="submitted.set(true)"
        fktButton
        label="Submit">
</button>
