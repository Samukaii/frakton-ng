<div class="container">
    <div class="container__list">
		<button
                [tooltipColor]="tooltipColor()"
                color="primary"
                fktButton
                fktTooltip="This is a basic tooltip message"
                label="Hover me">
        </button>

        <button
                [tooltipColor]="tooltipColor()"
                color="primary"
                fktButton
                fktTooltip="Click this button to perform an action"
                label="Info Button">
        </button>

        <button
                [disabled]="true"
                [tooltipColor]="tooltipColor()"
                color="primary"
                fktButton
                fktTooltip="This button is disabled"
                label="Disabled State">
        </button>
    </div>
</div>
