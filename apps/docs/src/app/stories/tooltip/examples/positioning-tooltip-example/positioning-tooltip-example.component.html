<div class="container">
    <div class="container__list">
        <div class="container__item">
            <h4 class="container__item-title">Top Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top start positioned tooltip"
                        label="Top Start"
                        position="top-start">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top center positioned tooltip"
                        label="Top Center"
                        position="top-center">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top end positioned tooltip"
                        label="Top End"
                        position="top-end">
                </button>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Bottom Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom start positioned tooltip"
                        label="Bottom Start"
                        position="bottom-start">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom center positioned tooltip (default)"
                        label="Bottom Center"
                        position="bottom-center">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom end positioned tooltip"
                        label="Bottom End"
                        position="bottom-end">
                </button>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Side Positions</h4>
            <div class="container__item-buttons">
                <div class="container__item-cols">
                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Start top positioned tooltip"
                            label="Start Top"
                            position="start-top">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Start center positioned tooltip"
                            label="Start Center"
                            position="start-center">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Start bottom positioned tooltip"
                            label="Start Bottom"
                            position="start-bottom">
                    </button>
                </div>

                <div class="container__item-cols">
                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="End top positioned tooltip"
                            label="End Top"
                            position="end-top">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="End center positioned tooltip"
                            label="End Center"
                            position="end-center">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="End bottom positioned tooltip"
                            label="End Bottom"
                            position="end-bottom">
                    </button>
                </div>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Corner Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom start corner positioned tooltip"
                        label="Bottom Start Corner"
                        position="bottom-start-corner">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top start corner positioned tooltip"
                        label="Top Start Corner"
                        position="top-start-corner">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom end corner positioned tooltip"
                        label="Bottom End Corner"
                        position="bottom-end-corner">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top end corner positioned tooltip"
                        label="Top End Corner"
                        position="top-end-corner">
                </button>
            </div>
        </div>
    </div>
</div>
