<div class="container">
    <div class="container__list">
        <div class="container__item">
            <h4 class="container__item-title">Top Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top start positioned tooltip"
                        label="Top Start"
                        position="top-start">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top center positioned tooltip"
                        label="Top Center"
                        position="top-center">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top end positioned tooltip"
                        label="Top End"
                        position="top-end">
                </button>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Bottom Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom start positioned tooltip"
                        label="Bottom Start"
                        position="bottom-start">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom center positioned tooltip (default)"
                        label="Bottom Center"
                        position="bottom-center">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="danger"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom end positioned tooltip"
                        label="Bottom End"
                        position="bottom-end">
                </button>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Side Positions</h4>
            <div class="container__item-buttons">
                <div class="container__item-cols">
                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Left start positioned tooltip"
                            label="Left Start"
                            position="left-start">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Left center positioned tooltip"
                            label="Left Center"
                            position="left-center">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="success"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Left end positioned tooltip"
                            label="Left End"
                            position="left-end">
                    </button>
                </div>

                <div class="container__item-cols">
                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Right start positioned tooltip"
                            label="Right Start"
                            position="right-start">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Right center positioned tooltip"
                            label="Right Center"
                            position="right-center">
                    </button>

                    <button
                            [tooltipColor]="tooltipColor()"
                            color="accent"
                            disableAutoReposition
                            fktButton
                            fktTooltip="Right end positioned tooltip"
                            label="Right End"
                            position="right-end">
                    </button>
                </div>
            </div>
        </div>

        <div class="container__item">
            <h4 class="container__item-title">Corner Positions</h4>
            <div class="container__item-buttons">
                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom left positioned tooltip"
                        label="Bottom Left"
                        position="bottom-left">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top left positioned tooltip"
                        label="Top Left"
                        position="top-left">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Bottom right positioned tooltip"
                        label="Bottom Right"
                        position="bottom-right">
                </button>

                <button
                        [tooltipColor]="tooltipColor()"
                        color="primary"
                        disableAutoReposition
                        fktButton
                        fktTooltip="Top right positioned tooltip"
                        label="Top Right"
                        position="top-right">
                </button>
            </div>
        </div>
    </div>
</div>
