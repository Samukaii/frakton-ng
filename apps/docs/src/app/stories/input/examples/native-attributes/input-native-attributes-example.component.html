<fkt-field label="Email address">
    <fkt-icon fktFieldPrefix name="envelope" />
    <input
        fktInputText
        type="email"
        autocomplete="email"
        inputmode="email"
        placeholder="name@example.com"
    >
</fkt-field>

<fkt-field label="Search" hideLabel>
    <fkt-icon fktFieldPrefix name="magnifying-glass" />
    <input
        fktInputText
        type="search"
        autocomplete="off"
        placeholder="Search items..."
    >
</fkt-field>
