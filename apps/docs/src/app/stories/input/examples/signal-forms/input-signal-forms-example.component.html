<div class="actions">
    <button (click)="fill()" fktButton label="Fill">
    </button>
    <button (click)="reset()" fktButton label="Reset">
    </button>
</div>

<fkt-field
        [showError]="form.name().invalid() && form.name().touched()"
        label="Name"
>
    <fkt-icon fktFieldPrefix name="user"/>
    <input
            [formField]="form.name"
            fktInputText
            placeholder="Enter a name"
    >
</fkt-field>

<fkt-field
        [showError]="form.email().invalid() && form.email().touched()"
        label="E-mail"
>
    <fkt-icon fktFieldPrefix name="envelope"/>
    <input
            [formField]="form.email"
            fktInputText
            placeholder="Enter an e-mail"
            type="email"
    >
</fkt-field>
