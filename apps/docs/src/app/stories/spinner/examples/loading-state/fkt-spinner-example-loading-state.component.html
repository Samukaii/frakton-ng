<div class="container">
    @if (isLoading()) {
        <div class="container__loading">
            <fkt-spinner [color]="color()" [size]="size()" [stroke]="stroke()"/>
            <span>Loading data...</span>
        </div>
    } @else {
        <div class="container__success">
            <fkt-icon
                    name="check"
            />
            Data loaded successfully!
        </div>
    }

    <button
            (click)="toggleLoading()"
            [label]="isLoading() ? 'Stop Loading' : 'Start Loading'"
            fktButton
    >
	</button>
</div>
