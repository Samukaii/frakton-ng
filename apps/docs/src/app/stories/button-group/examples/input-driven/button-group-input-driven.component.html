<div>
    <fkt-button-group
            [(touched)]="touched"
            [(value)]="value"
            [disabled]="disabled()"
            [invalid]="!value() && touched()"
            [options]="options"
            accessibleLabel="Filter"
            deselectable
    />
    <fkt-field-error
            [show]="!value() && touched()"
            error="Field is required"
    />
</div>


<button
        (click)="toggleDisabled()"
        fktButton
        label="Disable">
</button>
