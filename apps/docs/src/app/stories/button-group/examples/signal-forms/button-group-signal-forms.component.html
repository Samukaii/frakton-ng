<div>
    <fkt-button-group
        accessibleLabel="Filter"
        [field]="form.filter"
        [options]="options"
        deselectable
    />
    <fkt-field-error
        [show]="form.filter().invalid() && form.filter().touched()"
        [error]="form.filter().errors()[0]?.message"
    />
</div>

<fkt-button
    text="Disable"
    (click)="toggleDisabled()"
/>
