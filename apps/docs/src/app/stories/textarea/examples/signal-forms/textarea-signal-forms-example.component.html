<div class="actions">
    <button (click)="reset()" fktButton label="Reset">
    </button>
    <button (click)="fill()" fktButton label="Fill">
    </button>
</div>

<fkt-field label="Support message">
    <textarea
            [formField]="form.message"
            autoExpand
            fktTextarea
            placeholder="Describe the issue..."
            rows="3"
    ></textarea>
</fkt-field>
