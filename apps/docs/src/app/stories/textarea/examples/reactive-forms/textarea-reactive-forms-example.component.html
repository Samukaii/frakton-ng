<div class="actions">
    <button (click)="reset()" fktButton label="Reset">
    </button>
    <button (click)="fill()" fktButton label="Fill">
    </button>
</div>

<form [formGroup]="form">
    <fkt-field label="Review comment">
        <textarea
            fktTextarea
            fktCharacterCount
            autoExpand
            rows="3"
            formControlName="comment"
            placeholder="Write a review comment..."
        ></textarea>
    </fkt-field>
</form>
