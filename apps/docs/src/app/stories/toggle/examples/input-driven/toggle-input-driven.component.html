<div>
    <fkt-toggle
            [(touched)]="touched"
            [(value)]="value"
            [disabled]="disabled()"
            [invalid]="!value() && touched()"
            label="Accept terms and conditions"
    />
    <fkt-field-error
            [show]="!value() && touched()"
            error="You must accept the terms"
    />
</div>

<button
        (click)="toggleDisabled()"
        fktButton
        label="Disable">
</button>
