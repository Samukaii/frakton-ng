<fkt-table
        [(columnOrder)]="columnOrder"
        [(columnWidths)]="columnWidths"
        [(filters)]="filters"
        [columns]="columns"
        [data]="data()"
        [loading]="response.isLoading()"
        fktTableReorder
        fktTableResize
>
    <div fktTableToolbar>
        <button
                (click)="reset()"
                fktButton
                icon="arrow-uturn-left"
                label="Reset layout">
        </button>
    </div>
</fkt-table>
