<fkt-table
    #exporter="fktTableExport"
    [columns]="columns"
    [data]="data()"
    [loading]="response.isLoading()"
    fktTableExport
>
    <div fktTableToolbar>
        <button
                (click)="exporter.exportCsv()"
                fktButton
                icon="arrow-up-on-square"
                label="Export CSV">
        </button>
    </div>
</fkt-table>
