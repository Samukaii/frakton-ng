<div class="preview">
    <button
        (click)="resetFilters()"
        fktButton
        label="Reset all filters">
    </button>
</div>

<fkt-table
        [(filters)]="filters"
        [columns]="columns"
        [data]="products()"
        [defaultFilters]="defaultFilters"
        [loading]="loading()"
        [noResults]="noResults()"
>
</fkt-table>

<app-code-output [value]="filters()" title="Filters value"/>
