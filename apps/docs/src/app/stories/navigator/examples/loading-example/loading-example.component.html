<div class="container">
	<button
            (click)="toggleLoading()"
            [label]="isLoading() ? 'Stop Loading' : 'Start Loading'"
            fktButton>
    </button>
    <fkt-navigator
            (next)="handleNext()"
            (previous)="handlePrevious()"
            [canGoToNext]="!isLoading()"
            [canGoToPrevious]="!isLoading()"
    >
        <div>
            <div class="loading-content">
                <fkt-spinner [size]="25"/>
                <div>
                    Loading...
                </div>
            </div>
        </div>
    </fkt-navigator>

</div>
