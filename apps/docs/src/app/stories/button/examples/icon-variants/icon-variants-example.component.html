@for (shape of shapes; track shape.value) {
<table>
    <thead>
        <tr>
            <th colspan="7">
                {{ shape.title }}
            </th>
        </tr>
    </thead>
    <tbody>
        @for (appearance of shape.appearances; track appearance.value) {
        <tr>
            <td class="appearance">
                {{ appearance.title }}
            </td>

            @for (color of appearance.colors; track color.value) {
            <td>
                <button
                    [appearance]="appearance.value"
                    [color]="color.value"
                    [label]="'Add ' + color.title"
                    [shape]="shape.value"
                    fktButton
                    icon="hand-thumb-up"
                    iconOnly
                ></button>
            </td>
            }
        </tr>
        }
    </tbody>
</table>
}
