<div class="container">
    <div class="container__actions">
        <button
            (click)="openSimpleDialog()"
            appearance="stroked"
            fktButton
            label="Simple Dialog">
        </button>

        <button
            (click)="openFormDialog()"
            appearance="stroked"
            fktButton
            label="Form Dialog">
        </button>

        <button
            (click)="openCustomDialog()"
            appearance="stroked"
            color="success"
            fktButton
            label="Custom Dialog">
        </button>

        <button
            (click)="openConfirmDialog()"
            appearance="stroked"
            color="danger"
            fktButton
            label="Confirm Action">
        </button>

        <button
            (click)="openFullScreenDialog()"
            appearance="stroked"
            color="accent"
            fktButton
            label="Full Screen Dialog">
        </button>

        <button
            (click)="openSmallDialog()"
            appearance="stroked"
            fktButton
            label="Small Dialog">
        </button>
    </div>
</div>
