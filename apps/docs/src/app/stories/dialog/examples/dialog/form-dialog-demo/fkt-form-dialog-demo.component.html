<h2 class="header">{{ title() }}</h2>
<p class="description">{{ description() }}</p>

<div class="form">
	<fkt-field label="Name">
		<input
			fktInputText
			[formField]="form.name"
			placeholder="Enter your name"
		/>
	</fkt-field>

	<fkt-field label="Email">
		<input
			fktInputText
			[formField]="form.email"
			placeholder="Enter your email"
			type="email"
		/>
	</fkt-field>
</div>

<fkt-buttons-list
	[actions]="actions()"
	fill
></fkt-buttons-list>
