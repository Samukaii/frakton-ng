<div class="actions">
    <button
            (click)="fill()"
            appearance="stroked"
            fktButton
            icon="pencil"
            shape="rounded"
            label="Write hydrated user">
    </button>
</div>

<fkt-select
        [formControl]="assignee"
        [options]="users"
        label="Assignee"
        labelKey="name"
        placeholder="Select an assignee"
        valueKey="id"
/>

<app-code-output [value]="value()" title="Normalized field value"/>
