<div class="actions">
    <button
            (click)="fill()"
            appearance="stroked"
            fktButton
            icon="pencil"
            label="Fill"
            shape="rounded">
    </button>
    <button
            (click)="reset()"
            appearance="stroked"
            fktButton
            icon="arrow-uturn-left"
            label="Reset"
            shape="rounded">
    </button>
    <button
            (click)="toggleDisabled()"
            appearance="stroked"
            fktButton
            icon="lock-closed"
            label="Toggle disabled"
            shape="rounded">
    </button>
</div>

<fkt-select
        [formField]="form.assignee"
        [options]="users"
        label="Assignee"
        labelKey="name"
        placeholder="Select an assignee"
        valueKey="id"
/>

<app-code-output [value]="model()" title="Form value"/>
