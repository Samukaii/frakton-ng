<div class="actions">
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="pencil"
        shape="rect"
        text="Fill"
        (click)="fill()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="arrow-uturn-left"
        shape="rect"
        text="Reset"
        (click)="reset()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="lock-closed"
        shape="rect"
        text="Toggle disabled"
        (click)="toggleDisabled()"
    />
</div>

<fkt-select
    label="Assignee"
    placeholder="Select an assignee"
    [formField]="form.assignee"
    [options]="users"
    labelKey="name"
    valueKey="id"
/>

<app-code-output [value]="model()" title="Form value"/>
