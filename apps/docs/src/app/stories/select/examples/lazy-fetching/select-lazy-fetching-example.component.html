<fkt-select
    label="Assignee"
    placeholder="Select an assignee"
    [loading]="loading()"
    [options]="users()"
    labelKey="name"
    valueKey="id"
    (dropdownOpenChange)="fetchOptions($event)"
/>

<app-code-output
    title="Fetch state"
    [value]="{ fetched: users().length > 0, options: users().length }"
/>
