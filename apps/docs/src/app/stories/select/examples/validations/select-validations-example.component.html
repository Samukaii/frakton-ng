<div class="actions">
    <button
            (click)="validate()"
            appearance="stroked"
            fktButton
            icon="check-circle"
            label="Validate"
            shape="rounded">
    </button>
</div>

<div class="fields">
    <fkt-select
            [formControl]="automatic"
            [options]="users"
            label="Automatic validation"
            labelKey="name"
            placeholder="Select an assignee"
            valueKey="id"
    >
        <fkt-icon fktFieldPrefix name="user"/>
    </fkt-select>

    <fkt-select
            [formControl]="custom"
            [options]="users"
            label="Custom validation"
            labelKey="name"
            placeholder="Select an assignee"
            valueKey="id"
    >
        <fkt-icon fktFieldPrefix name="user"/>
        <fkt-field-error fktError>
            Select the user responsible for this task.
        </fkt-field-error>
    </fkt-select>
</div>
