<div class="actions">
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="check-circle"
        shape="rect"
        text="Validate"
        (click)="validate()"
    />
</div>

<fkt-autocomplete
    label="Approver"
    placeholder="Select an approver"
    [formControl]="approver"
    [options]="users"
    labelKey="name"
    valueKey="id"
    groupKey="department"
    localSearch
>
    <fkt-icon fktFieldPrefix name="user" />
    <fkt-icon fktFieldSuffix name="information-circle" />

    <span fktHintStart>Projected error content replaces the automatic message.</span>
    <span fktHintEnd>Required</span>

    <fkt-field-error fktError>
        Choose an approver before continuing.
    </fkt-field-error>
</fkt-autocomplete>

<app-code-output [value]="value()" title="Field value"/>
