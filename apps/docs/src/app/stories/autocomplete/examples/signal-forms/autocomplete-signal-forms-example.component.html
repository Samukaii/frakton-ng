<div class="actions">
    <button
            (click)="fill()"
            appearance="stroked"
            fktButton
            icon="pencil"
            label="Fill"
            shape="rounded">
    </button>
    <button
            (click)="reset()"
            appearance="stroked"
            fktButton
            icon="arrow-uturn-left"
            label="Reset"
            shape="rounded">
    </button>
    <button
            (click)="toggleDisabled()"
            appearance="stroked"
            fktButton
            icon="lock-closed"
            label="Toggle disabled"
            shape="rounded">
    </button>
</div>

<fkt-autocomplete
        [formField]="form.country"
        [options]="countries"
        groupKey="continent"
        label="Country"
        labelKey="name"
        localSearch
        valueKey="code"
/>

<app-code-output [value]="model()" title="Form value"/>
