<div class="actions">
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="pencil"
        shape="rect"
        text="Fill"
        (click)="fill()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="arrow-uturn-left"
        shape="rect"
        text="Reset"
        (click)="reset()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="lock-closed"
        shape="rect"
        text="Toggle disabled"
        (click)="toggleDisabled()"
    />
</div>

<fkt-autocomplete
    label="Country"
    [formField]="form.country"
    [options]="countries"
    labelKey="name"
    valueKey="code"
    groupKey="continent"
    localSearch
/>

<app-code-output [value]="model()" title="Form value"/>
