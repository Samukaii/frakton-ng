<div class="actions">
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="pencil"
        shape="rect"
        text="Fill"
        (click)="fill()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="arrow-uturn-left"
        shape="rect"
        text="Reset"
        (click)="reset()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="lock-closed"
        shape="rect"
        text="Toggle disabled"
        (click)="toggleDisabled()"
    />
</div>

<form [formGroup]="form">
    <fkt-autocomplete
        label="Assignee"
        formControlName="assignee"
        [options]="users"
        labelKey="name"
        valueKey="id"
        groupKey="department"
        localSearch
    />
</form>

<app-code-output [value]="formValue()" title="Form value"/>
