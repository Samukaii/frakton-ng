<div class="actions">
    <button
            (click)="fill()"
            appearance="stroked"
            fktButton
            icon="pencil"
            label="Fill"
            shape="rounded">
    </button>
    <button
            (click)="reset()"
            appearance="stroked"
            fktButton
            icon="arrow-uturn-left"
            label="Reset"
            shape="rounded">
    </button>
    <button
            (click)="toggleDisabled()"
            appearance="stroked"
            fktButton
            icon="lock-closed"
            label="Toggle disabled"
            shape="rounded">
    </button>
</div>

<form [formGroup]="form">
    <fkt-autocomplete
        label="Assignee"
        formControlName="assignee"
        [options]="users"
        labelKey="name"
        valueKey="id"
        groupKey="department"
        localSearch
    />
</form>

<app-code-output [value]="formValue()" title="Form value"/>
