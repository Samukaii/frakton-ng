<div class="actions">
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="list-bullet"
        shape="rect"
        text="Set ids"
        (click)="fillWithPrimitiveValues()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="user-plus"
        shape="rect"
        text="Set hydrated users"
        (click)="fillWithHydratedUsers()"
    />
    <fkt-button
        theme="stroked"
        iconPosition="left"
        icon="arrow-path-rounded-square"
        shape="rect"
        text="Load fresh options"
        (click)="loadFreshOptions()"
    />
</div>

<fkt-autocomplete
    label="Users"
    placeholder="Search for a user"
    [formControl]="usersControl"
    [options]="users"
    labelKey="name"
    valueKey="id"
    multiple
    localSearch
/>

<app-code-output [value]="value()" title="Field value"/>
