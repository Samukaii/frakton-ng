<div class="actions">
    <button
            (click)="fillWithPrimitiveValues()"
            appearance="stroked"
            fktButton
            shape="rounded"
            icon="list-bullet"
            label="Set ids">
    </button>
    <button
            (click)="fillWithHydratedUsers()"
            appearance="stroked"
            fktButton
            shape="rounded"
            icon="user-plus"
            label="Set hydrated users">
    </button>
    <button
            (click)="loadFreshOptions()"
            appearance="stroked"
            fktButton
            shape="rounded"
            icon="arrow-path-rounded-square"
            label="Load fresh options">
    </button>
</div>

<fkt-autocomplete
        [formControl]="usersControl"
        [options]="users"
        label="Users"
        labelKey="name"
        localSearch
        multiple
        placeholder="Search for a user"
        valueKey="id"
/>

<app-code-output [value]="value()" title="Field value"/>
