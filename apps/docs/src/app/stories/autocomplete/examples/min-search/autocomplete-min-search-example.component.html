<fkt-autocomplete
    label="User"
    [formControl]="user"
    placeholder="Hint: type 'wil'"
    [options]="results()"
    [minSearch]="3"
    [searchDebounce]="500"
    labelKey="name"
    valueKey="id"
    (searchChange)="searchUsers($event)"
/>

<app-code-output [value]="value()" title="Field value"/>
