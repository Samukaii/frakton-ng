<fkt-autocomplete
    localSearch
    label="User"
    placeholder="Search for a user"
    [formControl]="user"
    [options]="results()"
    [loading]="loading()"
    labelKey="name"
    valueKey="id"
    (dropdownOpenChange)="$event && canFetch.set(true)"
/>

<app-code-output
    title="Fetch state"
    [value]="{fetched: hasFetched(), value: value() }"
/>
