<div class="container">
    <div #left>
        <button
                (click)="openOverlay(left, 'left-center')"
                color="accent"
                fktButton
                label="Left Center">
        </button>
    </div>
    <div #right>
        <button
                (click)="openOverlay(right, 'right-center')"
                color="info"
                fktButton
                label="Right Center">
        </button>
    </div>
    <div #top>
        <button
                (click)="openOverlay(top, 'top-center')"
                color="success"
                fktButton
                label="Top Center">
        </button>
    </div>
    <div #bottom>
        <button
                (click)="openOverlay(bottom, 'bottom-center')"
                fktButton
                color="warning"
                label="Bottom Center (Default)">
        </button>
    </div>
</div>
