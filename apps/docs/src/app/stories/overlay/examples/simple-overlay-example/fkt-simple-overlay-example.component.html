<div class="container">
    <div #start>
        <button
                (click)="openOverlay(start, 'start-center')"
                color="accent"
                fktButton
                label="Start Center">
        </button>
    </div>
    <div #end>
        <button
                (click)="openOverlay(end, 'end-center')"
                color="info"
                fktButton
                label="End Center">
        </button>
    </div>
    <div #top>
        <button
                (click)="openOverlay(top, 'top-center')"
                color="success"
                fktButton
                label="Top Center">
        </button>
    </div>
    <div #bottom>
        <button
                (click)="openOverlay(bottom, 'bottom-center')"
                fktButton
                color="warning"
                label="Bottom Center (Default)">
        </button>
    </div>
</div>
