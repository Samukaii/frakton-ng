<div class="container">
    <div #infoButton>
        <button
                (click)="openTooltip(infoButton, 'info', 'This is an informational tooltip message.', 'top-start')"
                color="primary"
                fktButton
                label="Info Tooltip">
        </button>
    </div>

    <div #warningButton>
        <button
                (click)="openTooltip(warningButton, 'warning', 'This is a warning tooltip message.', 'top-start')"
                color="accent"
                fktButton
                label="Warning Tooltip">
        </button>
    </div>

    <div #errorButton>
        <button
                (click)="openTooltip(errorButton, 'danger', 'This is an error tooltip message.', 'bottom-start')"
                color="danger"
                fktButton
                label="Error Tooltip">
        </button>
    </div>

    <div #successButton>
        <button
                (click)="openTooltip(successButton, 'success', 'This is a success tooltip message.', 'bottom-start')"
                color="success"
                fktButton
                label="Success Tooltip">
        </button>
    </div>
</div>
