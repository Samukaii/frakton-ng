<div class="container">
    <div #fileActionsButton>
        <button
                fktButton
                (click)="openFileActionsMenu(fileActionsButton)"
                color="primary"
                suffixIcon="chevron-down"
                label="File Actions">
        </button>
    </div>
    <div #userProfileButton>
        <button
                fktButton
                (click)="openUserProfileMenu(userProfileButton)"
                color="success"
                suffixIcon="chevron-down"
                label="User Profile">
        </button>
    </div>
    <div #settingsButton>
        <button
                fktButton
                (click)="openSettingsMenu(settingsButton)"
                color="primary"
                suffixIcon="chevron-down"
                label="Settings">
        </button>
    </div>
    <div #adminButton>
        <button
                fktButton
                (click)="openAdminMenu(adminButton)"
                color="danger"
                suffixIcon="chevron-down"
                label="Admin Actions">
        </button>
    </div>
</div>
