<div class="container">
    <div #contactFormButton>
        <button
                (click)="openContactForm(contactFormButton)"
                color="primary"
                fktButton
                label="Contact Form">
        </button>
    </div>
    <div #feedbackFormButton>
        <button
                (click)="openFeedbackForm(feedbackFormButton)"
                color="success"
                fktButton
                label="Feedback Form">
        </button>
    </div>

    <div #settingsFormButton>
        <button
                (click)="openSettingsForm(settingsFormButton)"
                color="primary"
                fktButton
                label="User Settings">
        </button>
    </div>
</div>
