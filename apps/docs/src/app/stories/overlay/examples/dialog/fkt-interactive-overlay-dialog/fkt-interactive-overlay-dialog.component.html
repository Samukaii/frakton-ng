<div class="container">
    <div class="container__header">
        <div>
            <fkt-icon class="container__header-icon" name="cursor-arrow-ripple" size="md"></fkt-icon>
            <h3 class="container__header-title">{{ title() }}</h3>
        </div>
    </div>

    <p class="container__description">{{ description() }}</p>

    <hr>

    <div class="container__counter">
        <div class="container__counter-title">
            <h4>
                Counter:
            </h4>
            <fkt-tag
                    [text]="counter().toString()"
                    color="success"
            ></fkt-tag>
        </div>

        <div class="container__counter-actions">
            <button
                    (click)="decrement()"
                    [disabled]="counter() <= 0"
                    appearance="basic"
                    color="danger"
                    fktButton
                    icon="minus-circle"
                    iconOnly
                    label="Decrease counter"
                    shape="pill"
                    size="sm">
            </button>
            <button
                    (click)="increment()"
                    appearance="basic"
                    color="success"
                    fktButton
                    icon="plus-circle"
                    iconOnly
                    label="Increase counter"
                    shape="pill"
                    size="sm">
            </button>
            <button
                    (click)="reset()"
                    appearance="stroked"
                    color="primary"
                    fktButton
                    label="Reset"
                    shape="rounded">
            </button>
        </div>
    </div>
    <hr>

    @if (currentItems().length > 0) {
        <div class="container__items">
            <h4 class="container__items-title">Items</h4>
            <div class="container__items-list">
                @for (item of currentItems(); track $index) {
                    <div class="container__items-item">
                        <span>{{ item }}</span>
                        <button
                                (click)="removeItem($index)"
                                [disabled]="currentItems().length <= 1"
                                appearance="basic"
                                color="danger"
                                fktButton
                                icon="x-mark"
                                iconOnly
                                label="Remove item"
                                shape="pill"
                                size="sm">
                        </button>
                    </div>
                }
            </div>
        </div>
    }

    <div class="container__items-actions">
        <button
                (click)="addItem()"
                appearance="stroked"
                color="primary"
                fktButton
                label="Add Item">
        </button>
        <button
                (click)="clearItems()"
                [disabled]="currentItems().length <= 1"
                appearance="stroked"
                color="danger"
                fktButton
                label="Clear All">
        </button>
    </div>

    <hr>

    <div class="container__actions">
        <button
                (click)="handleDone()"
                appearance="raised"
                fktButton
                label="Done">
        </button>
    </div>
</div>
