<div class="container">
	<div class="container__header">
		<fkt-icon name="document-text" class="container__header-icon"></fkt-icon>
		<h3 class="container__header-title">{{ title() }}</h3>
	</div>

	<p class="container__description">{{ description() }}</p>

	<form class="container__form" (ngSubmit)="handleSubmit()">
		<fkt-field label="Name">
			<input
				fktInputText
				[formField]="form.name"
				placeholder="Enter your name"
			/>
		</fkt-field>

		<fkt-field label="Email">
			<input
				fktInputText
				[formField]="form.email"
				placeholder="Enter your email"
				type="email"
			/>
		</fkt-field>

		<fkt-textarea
			[formField]="form.message"
			label="Message"
			placeholder="Enter a message"
		></fkt-textarea>
		<fkt-field-error [show]="form.message().invalid() && form.message().touched()"
						 [error]="form.message().errors()[0]?.message"/>

		<div class="container__form-actions">
			<fkt-button
				text="Cancel"
				theme="stroked"
				type="button"
				(click)="handleCancel()"
			></fkt-button>
			<fkt-button
				text="Submit"
				theme="raised"
				type="submit"
				[disabled]="!form().valid()"
			></fkt-button>
		</div>
	</form>
</div>
