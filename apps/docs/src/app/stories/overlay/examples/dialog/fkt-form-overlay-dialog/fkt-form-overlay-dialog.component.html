<div class="container">
    <div class="container__header">
        <fkt-icon class="container__header-icon" name="document-text"></fkt-icon>
        <h3 class="container__header-title">{{ title() }}</h3>
    </div>

    <p class="container__description">{{ description() }}</p>

    <form (ngSubmit)="handleSubmit()" class="container__form">
        <fkt-field label="Name">
            <input
                    [formField]="form.name"
                    fktInputText
                    placeholder="Enter your name"
            />
        </fkt-field>

        <fkt-field label="Email">
            <input
                    [formField]="form.email"
                    fktInputText
                    placeholder="Enter your email"
                    type="email"
            />
        </fkt-field>

        <fkt-field label="Message">
            <textarea fktTextarea [formField]="form.message" placeholder="Enter a message"></textarea>
        </fkt-field>

        <div class="container__form-actions">
			<button
                    (click)="handleCancel()"
                    appearance="stroked"
                    fktButton
                    label="Cancel"
                    type="button">
            </button>
            <button
                    [disabled]="!form().valid()"
                    appearance="raised"
                    fktButton
                    label="Submit"
                    type="submit">
            </button>
        </div>
    </form>
</div>
