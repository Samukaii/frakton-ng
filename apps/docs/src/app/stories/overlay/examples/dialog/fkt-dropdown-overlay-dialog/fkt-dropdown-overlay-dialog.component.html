<div class="container">
    @for (option of options(); track option.action) {
        <button
                (click)="handleOptionClick(option)"
                [disabled]="option.disabled ?? false"
                [icon]="option.icon"
                [label]="option.label"
                appearance="stroked"
                shape="rounded"
                fktButton>
        </button>
    }
</div>
