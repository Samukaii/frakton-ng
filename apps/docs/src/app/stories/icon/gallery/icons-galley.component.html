<div class="gallery">
    <fkt-field label="Search...">
        <fkt-icon fktFieldPrefix name="magnifying-glass"/>
        <input
                (blur)="grid.reset()"
                (keydown)="grid.handleKeyDown($event)"
                [attr.aria-activedescendant]=""
                [attr.aria-controls]="galleryId"
                [formField]="search"
                aria-autocomplete="list"
                aria-expanded="true"
                fktInputText placeholder="Search for the icon you want" role="combobox">
    </fkt-field>
    <fkt-button-group accessibleLabel="Variants" [(value)]="variant" [options]="options"/>

    <div #gallery [id]="galleryId" class="gallery__item" role="listbox">
        @for (icon of filteredIcons(); track icon) {
            <fkt-icons-gallery-item
                    (copyIcon)="copyIconName(icon)"
                    [copied]="copiedIcons().includes(icon)"
                    [descendantActive]="$index === grid.activeIndex()"
                    [descendantId]="`${galleryId}-item-${$index}`"
                    [variant]="variant()"
                    [icon]="icon"
            />
        }
    </div>
</div>
