<div class="container">
    <div
        [id]="descendantId()"
        [class.virtual-focused]="descendantActive()"
        [attr.aria-selected]="descendantActive()"
        [class.copied]="copied()"
        (click)="copyIcon.emit()"
        class="container__card">
        <div class="copy-text">
            <fkt-icon name="check"/>
            <span>Copied</span>
        </div>

        <fkt-icon
            class="container__card-icon"
            [name]="icon()"
        />
    </div>


    <p class="container__icon-name">
        {{ icon() }}
    </p>

</div>
