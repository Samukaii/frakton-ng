<fkt-tabs-list (activeTabChange)="activeTabChange.emit($event!)" [activeTab]="activeTab()" hideTabsWhenOnlyOne
               renderMode="eager">
    <fkt-tab [hidden]="!isStoryType()" key="features" label="Features">
        @if (!loading()) {
            <app-features
                    [description]="description()"
                    [importStatement]="importStatement()"
                    [title]="title()"
            />
        }
    </fkt-tab>


    <fkt-tab key="api-reference" label="API">
        <div class="container">
            <div class="docs">
                @if (!loading()) {
                    <app-api-reference
                            [docs]="docs()"
                            [story]="currentStoryData()"
                            [title]="title()"
                    />
                }
            </div>
        </div>
    </fkt-tab>
</fkt-tabs-list>

@if (loading()) {
    <div class="loading">
        <fkt-skeleton-container>
            <fkt-skeleton height="40px" marginBottom="1rem" width="200px"/>
            <fkt-skeleton height="20px" width="80%"/>
            <fkt-skeleton height="20px" width="40%"/>
        </fkt-skeleton-container>

        <fkt-skeleton-container>
            <fkt-skeleton height="30px" marginBottom="1rem" width="200px"/>
            <fkt-skeleton height="20px" marginBottom="2rem" width="60%"/>
            <fkt-skeleton height="200px" width="100%"/>
        </fkt-skeleton-container>
        <fkt-skeleton-container>
            <fkt-skeleton height="30px" marginBottom="1rem" width="200px"/>
            <fkt-skeleton height="20px" marginBottom="2rem" width="60%"/>
            <fkt-skeleton height="200px" width="100%"/>
        </fkt-skeleton-container>
        <fkt-skeleton-container>
            <fkt-skeleton height="30px" marginBottom="1rem" width="200px"/>
            <fkt-skeleton height="20px" marginBottom="2rem" width="60%"/>
            <fkt-skeleton height="200px" width="100%"/>
        </fkt-skeleton-container>
    </div>
}
