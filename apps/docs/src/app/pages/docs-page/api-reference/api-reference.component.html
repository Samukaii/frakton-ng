<div class="header">
    <h1>{{ title() }}</h1>

    <button
            (click)="clipboard.copy()"
            [appearance]="clipboard.copied() ? 'raised': 'stroked'"
            [color]="clipboard.copied() ? 'success': 'primary'"
            [icon]="clipboard.copied() ? 'check': 'clipboard-document'"
            [label]="clipboard.copied() ? 'Copied': 'Copy markdown'"
            fktButton
            shape="rounded">
    </button>
</div>

<fkt-markdown
        [data]="docs()!"
/>
