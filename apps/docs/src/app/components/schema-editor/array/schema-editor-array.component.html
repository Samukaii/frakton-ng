<ng-template #actionsHeader>
    <button color="accent" fktButton icon="plus" iconOnly label="Add new item" shape="pill" (click)="createNew()">
    </button>
</ng-template>

<div class="table">
    <fkt-table
            [columns]="columns()"
            [data]="valueWithIds()"
            [loading]="false"
            disableRowHover
    />
</div>
