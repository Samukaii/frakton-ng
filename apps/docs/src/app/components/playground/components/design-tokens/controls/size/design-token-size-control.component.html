<fkt-field
    [label]="token().name"
    hideLabel
>
    <input
        fktInputText
        placeholder="Enter the size"
        [value]="token().control()"
        (input)="token().control.set($any($event.target).value)"
        (keydown)="onKeydown($event, token().control)"
    />

    <div fktFieldSuffix class="numeric-control">
        <fkt-icon
            (mousedown)="update($any($event), token().control, 'increase')"
            name="chevron-up"
        />
        <fkt-icon
            (mousedown)="update($any($event), token().control, 'decrease')"
            name="chevron-down"
        />
    </div>
</fkt-field>
