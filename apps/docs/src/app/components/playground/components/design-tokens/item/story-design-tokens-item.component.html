<div class="header">
    <button #button (mouseover)="openInfo(button)" (focus)="openInfo(button)" (blur)="overlayRef?.close()" class="token">
        <fkt-icon [name]="categoryIcon() ?? 'academic-cap'"/>
        <span [fktTooltip]="designToken().name" detectOverflow>
	        {{ designToken().name | humanizeDesignToken: templateSelector() }}
	    </span>
    </button>

    <div class="actions">
        <div>
            @if (hasChanges()) {
                <fkt-button
                    (click)="resetToken()"
                    ariaLabel="Reset token"
                    fktTooltip="Reset token"
                    shape="rect"
                    color="primary"
                    theme="basic"
                    icon="arrow-uturn-left"
                />
            }

            <fkt-button
                (click)="copyToken()"
                [ariaLabel]="copied() ? 'Copied': 'Copy this token'"
                [fktTooltip]="copied() ? 'Copied': 'Copy this token'"
                [shape]="copied() ? 'rounded': 'rounded'"
                [color]="copied() ? 'success': 'primary'"
                [theme]="copied() ? 'raised' : 'basic'"
                [icon]="copied()  ? 'check' : 'clipboard-document-list'"
            />
        </div>
    </div>
</div>

<div class="controls">
    @switch (designToken().type) {
        @case ("size") {
            <app-design-token-size-control [token]="designToken()"/>
        }
        @case ("spacing") {
            <app-design-token-spacing-control [token]="designToken()"/>
        }
        @case ("weight") {
            <app-design-token-weight-control [token]="designToken()"/>
        }
        @case ("opacity") {
            <app-design-token-opacity-control [token]="designToken()"/>
        }
        @case ("shadow") {
            <app-design-token-shadow-control [token]="designToken()"/>
        }
        @case ("transition") {
            <app-design-token-transition-control [token]="designToken()"/>
        }
        @case ("color") {
            <app-design-token-color-control [token]="designToken()"/>
        }
    }
</div>
