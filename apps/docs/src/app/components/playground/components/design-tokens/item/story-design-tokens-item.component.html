<div class="header">
    <button #button (blur)="overlayRef?.close()" (focus)="openInfo(button)" (mouseover)="openInfo(button)"
            class="token">
        <fkt-icon [name]="categoryIcon() ?? 'academic-cap'"/>
        <span [fktTooltip]="designToken().name" detectOverflow>
	        {{ designToken().name | humanizeDesignToken: templateSelector() }}
	    </span>
    </button>

    <div class="actions">
        <div>
            @if (hasChanges()) {
                <button
                        (click)="resetToken()"
                        appearance="basic"
                        color="primary"
                        fktButton
                        fktTooltip="Reset token"
                        icon="arrow-uturn-left"
                        iconOnly
                        label="Reset token">
                </button>
            }

            <button
                    (click)="clipboard.copy()"
                    [appearance]="clipboard.copied() ? 'raised' : 'basic'"
                    shape="pill"
                    [color]="clipboard.copied() ? 'success': 'primary'"
                    [fktTooltip]="clipboard.copied() ? 'Copied': 'Copy this token'"
                    [icon]="clipboard.copied()  ? 'check' : 'clipboard-document-list'"
                    [label]="clipboard.copied() ? 'Copied': 'Copy this token'"
                    fktButton
                    iconOnly>
            </button>
        </div>
    </div>
</div>

<div class="controls">
    @switch (designToken().type) {
        @case ("size") {
            <app-design-token-size-control [token]="designToken()"/>
        }
        @case ("spacing") {
            <app-design-token-spacing-control [token]="designToken()"/>
        }
        @case ("weight") {
            <app-design-token-weight-control [token]="designToken()"/>
        }
        @case ("text-decoration") {
            <app-design-token-text-decoration-control [token]="designToken()"/>
        }
        @case ("opacity") {
            <app-design-token-opacity-control [token]="designToken()"/>
        }
        @case ("shadow") {
            <app-design-token-shadow-control [token]="designToken()"/>
        }
        @case ("transition") {
            <app-design-token-transition-control [token]="designToken()"/>
        }
        @case ("color") {
            <app-design-token-color-control [token]="designToken()"/>
        }
        @case ("border") {
            <app-design-token-border-control [token]="designToken()"/>
        }
    }
</div>
