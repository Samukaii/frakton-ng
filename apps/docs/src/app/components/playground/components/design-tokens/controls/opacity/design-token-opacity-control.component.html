<fkt-field
    [label]="token().name"
    hideLabel
>
    <input
        fktInputText
        type="number"
        min="0"
        max="1"
        step="0.1"
        placeholder="Enter the opacity"
        [value]="token().control()"
        (input)="token().control.set($any($event.target).value)"
    />
</fkt-field>
