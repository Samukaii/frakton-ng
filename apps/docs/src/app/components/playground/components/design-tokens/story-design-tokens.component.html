@if (scopes().length > 2) {
    <div class="component-container">
        @for (scope of scopes(); track scope) {
            <button
                [class.active]="currentScope() === scope"
                (click)="currentScope.set(scope)" class="component">
                {{ scope.name }}
            </button>
        }
    </div>
}
<div class="list">
    @for (category of tokensCategories(); track category.name) {
        @for (token of category.tokens; track token.name) {
            <app-story-design-tokens-item
                [class.last]="$last"
                [designToken]="token"
                [templateSelector]="templateSelector()"
            />
        }
    }
</div>
