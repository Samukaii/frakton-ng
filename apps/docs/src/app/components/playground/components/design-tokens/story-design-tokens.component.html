<div class="header">
    @if (scopes().length > 2) {
        <div (select)="selectScopeByIndex($event)" childSelector=".scope" class="scopes-container" fktNavigableList
             orientation="horizontal">
            @for (scope of scopes(); track scope) {
                <button
                        (blur)="target.set(null)"
                        (click)="currentScope.set(scope)"
                        (focus)="showAnatomy(scope)"
                        (mouseenter)="showAnatomy(scope)"
                        (mouseout)="target.set(null)"
                        [class.active]="currentScope() === scope" class="scope">
                    {{ scope.name }}
                </button>
            }
        </div>
    }

    <div class="actions">
        @if (hasChanges()) {
            <button (click)="resetAll()" appearance="basic" fktButton fktTooltip="Reset all" icon="arrow-uturn-left"
                    iconOnly label="Reset all"></button>
            <button
                    (click)="copyAll()"
                    [appearance]="copied() ? 'raised' : 'basic'"
                    [fktTooltip]="copied() ? 'Copied' :'Copy all'"
                    [icon]="copied() ? 'check' :'clipboard'"
                    [label]="copied() ? 'Copied' : 'Copy all'"
                    fktButton
                    fktTooltip="Reset all"
                    iconOnly></button>
        }
    </div>
</div>
<div class="list">
    @for (token of tokensOrderedByCategory(); track token.name) {
        <app-story-design-tokens-item
                [class.last]="$last"
                [designToken]="token"
                [templateSelector]="templateSelector()"
        />
    }
</div>


@if (anatomyInfo(); as info) {
    <div [style.left.px]="info.x"
         [style.top.px]="info.y"
         class="anatomy">
        <span class="label">{{ target()?.name }}</span>
        <div [style.height.px]="info.height"
             [style.width.px]="info.width"
             class="range">
        </div>
    </div>
}
