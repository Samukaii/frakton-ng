@let example = externalExample.value();
@let files = example?.files ?? [];

@if (files.length) {
    @for (file of files; track file.name) {
        @if (currentTab() === $index) {
            <div [class.expanded]="expanded()" class="code">
                @if (example) {
                    <app-code-highlight
                        [language]="file.language"
                        [text]="file.content"
                        noBorderRadius
                    />
                }
            </div>
        }
    }
} @else {
    <div class="loading">
        <fkt-spinner />
    </div>
}

<div class="actions">
    <span class="show-on-hover">
        <button
            (click)="expanded.set(!expanded())"
            [fktTooltip]="expanded() ? 'Collapse code' : 'Expand code'"
            [icon]="expanded() ? 'arrows-pointing-in-northeast-southwest' : 'arrows-pointing-out-northeast-southwest'"
            [label]="expanded() ? 'Collapse code' : 'Expand code'"
            appearance="stroked"
            color="white"
            fktButton
            iconOnly
            shape="rounded"
            tooltipColor="white"
        ></button>
    </span>

    <div class="languages show-on-hover">
        @for (file of files; track file.name) {
            @let active = currentTab() === $index;

            <button
                (click)="setTab($index)"
                [appearance]="active ? 'raised' : 'stroked'"
                [attr.data-language]="file.language"
                [color]="file | call: getLanguageColor: active"
                [label]="file | call: getLanguageLabel"
                fktButton
                shape="sharp"
            ></button>
        }
    </div>

    <span>
        <button
            (click)="copy()"
            [appearance]="copied() ? 'raised': 'stroked'"
            [color]="copied() ? 'success' : 'white'"
            [icon]="copied() ? 'check':'clipboard-document'"
            [label]="copied() ? 'Copied' : 'Copy'"
            fktButton
            shape="rounded"
        ></button>
    </span>
</div>
