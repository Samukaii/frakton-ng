@switch (type()) {
    @case ('text') {
        <fkt-field
            [hideLabel]="!showLabel()"
            [label]="name()"
        >
            <input
                fktInputText
                placeholder="Enter a text"
                [value]="value()"
                (input)="update.emit($any($event.target).value)"
            />
        </fkt-field>
    }
    @case ("select") {
        <fkt-select
            [hideLabel]="!showLabel()"
            [value]="value()"
            (valueChange)="update.emit($event)"
            [label]="name()"
            [options]="options() ?? []"/>
    }
    @case ("array") {
        <fkt-schema-editor
            [schema]="schema() ?? {}"
            [value]="value()"
            [label]="name()"
            (valueChange)="update.emit($event)"
        />
    }
    @case ("object") {
        <fkt-schema-editor
            [schema]="schema() ?? {}"
            [value]="value()"
            [label]="name()"
            (valueChange)="update.emit($event)"
        />
    }

    @case ("icon") {
        <fkt-icon-selector
            [value]="value()"
            (valueChange)="update.emit($event)"
        />
    }

    @case ("boolean") {
        <fkt-toggle
            [label]="name()"
            [hideLabel]="!showLabel()"
            [value]="value()"
            (valueChange)="update.emit($event)"
        />
    }
}
