<div class="gallery">
    <fkt-field label="Search...">
        <fkt-icon fktFieldPrefix name="magnifying-glass"/>
        <input
            fktInputText
            [formField]="search"
            placeholder="Search for the icon you want"
        >
    </fkt-field>

    <div class="gallery__item">
        @for (icon of filteredIcons(); track icon) {
            <fkt-icon-selector-item
                [selected]="icon === value()"
                (select)="value.set(icon)"
                [icon]="icon"
            />
        }
    </div>
</div>
